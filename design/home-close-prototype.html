<title>Home Close</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: navy app rail + light work surface, FloQast-style close checklist with drawers for entry */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#E0E6EF; --line-2:#CBD5E3;
  --fg:#0D1D3A; --muted:#5A6A84; --faint:#8A98AE;
  --navy:#0A1F44; --navy-2:#13295A; --navy-fg:#E7EDF8; --navy-muted:#9AAAC8;
  --primary:#1C5CF0; --primary-hover:#174CC8; --primary-soft:#E8EEFE; --on-primary:#FFFFFF;
  --lime:#B9F04A;
  --good:#11935F; --good-soft:#E3F6EE;
  --warn:#B26B00; --warn-soft:#FFF3DC;
  --bad:#C9302C; --bad-soft:#FDE9E8;
  --info:#5B4BD8; --info-soft:#EEEBFD;
  --shadow:0 1px 2px rgba(13,29,58,.06),0 4px 16px rgba(13,29,58,.06);
  --overlay:rgba(8,18,38,.45);
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1325; --surface:#101C33; --surface-2:#14223D; --line:#21324F; --line-2:#2D4166;
  --fg:#E5ECF7; --muted:#97A7C2; --faint:#6E7F9C;
  --navy:#060E20; --navy-2:#0F1E3E; --navy-fg:#E5ECF7; --navy-muted:#8697B6;
  --primary:#5B8CFF; --primary-hover:#7AA2FF; --primary-soft:#172A52; --on-primary:#06112A;
  --lime:#B9F04A;
  --good:#3CCB8D; --good-soft:#0F3428; --warn:#F2B04A; --warn-soft:#3A2A0E;
  --bad:#FF7A72; --bad-soft:#3D1A1A; --info:#A79BFF; --info-soft:#241E4D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1325; --surface:#101C33; --surface-2:#14223D; --line:#21324F; --line-2:#2D4166;
  --fg:#E5ECF7; --muted:#97A7C2; --faint:#6E7F9C;
  --navy:#060E20; --navy-2:#0F1E3E; --navy-fg:#E5ECF7; --navy-muted:#8697B6;
  --primary:#5B8CFF; --primary-hover:#7AA2FF; --primary-soft:#172A52; --on-primary:#06112A;
  --lime:#B9F04A;
  --good:#3CCB8D; --good-soft:#0F3428; --warn:#F2B04A; --warn-soft:#3A2A0E;
  --bad:#FF7A72; --bad-soft:#3D1A1A; --info:#A79BFF; --info-soft:#241E4D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6);
  color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:.5rem 1rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:.32rem .75rem;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.16rem .6rem;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.awaiting{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2)}
.pill.entered{background:var(--info-soft);color:var(--info)}
.pill.scheduled{background:var(--primary-soft);color:var(--primary)}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.pill.offcycle{background:transparent;color:var(--faint);border:1px solid var(--line)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .5rem;border-radius:6px;font-size:.75rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* ===== Auth ===== */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-side{background:var(--navy);color:var(--navy-fg);padding:2.5rem clamp(1.25rem,4vw,3.5rem);display:flex;flex-direction:column;gap:2.5rem;position:relative;overflow:hidden}
.auth-side h1{font-size:clamp(1.9rem,3.4vw,2.8rem);line-height:1.1;font-weight:800;max-width:15ch;color:var(--navy-fg)}
.auth-side h1 em{font-style:normal;color:var(--lime)}
.auth-side p{color:var(--navy-muted);max-width:44ch;font-size:1rem}
.auth-preview{margin-top:auto;background:var(--navy-2);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:1rem;display:grid;gap:.55rem;max-width:440px}
.auth-preview .row{display:flex;align-items:center;gap:.6rem;font-size:.85rem}
.auth-preview .row .nm{flex:1;min-width:0}
.auth-preview .tick{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--navy-muted)}
.auth-preview .tick.on{background:var(--lime);border-color:var(--lime);color:#0A1F44}
.auth-preview .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.auth-preview .bar i{display:block;height:100%;width:57%;background:var(--lime)}
.auth-main{display:flex;align-items:center;justify-content:center;padding:2.5rem 1.25rem;background:var(--surface)}
.auth-form{width:100%;max-width:380px;display:grid;gap:1.1rem}
.auth-form h2{font-size:1.6rem;font-weight:800}
.proto-note{font-size:.8rem;padding:.6rem .8rem;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn)}
.sso{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.divider{display:flex;align-items:center;gap:.75rem;color:var(--faint);font-size:.78rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* Fields */
.field{display:grid;gap:.35rem}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.input,select.input{width:100%;padding:.58rem .75rem;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);min-width:0}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input-pre{position:relative}
.input-pre span{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--faint)}
.input-pre .input{padding-left:1.5rem;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.hint{font-size:.76rem;color:var(--faint)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.32rem .8rem;border-radius:999px;font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.togglechips{display:flex;flex-wrap:wrap;gap:.4rem}
.togglechips button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:.3rem .75rem;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.togglechips button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.switch{display:flex;align-items:center;gap:.6rem;cursor:pointer;font-weight:600;font-size:.85rem}
.switch input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{left:18px}

/* ===== App shell ===== */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--navy);color:var(--navy-fg);display:flex;flex-direction:column;padding:1.1rem .8rem;gap:1.2rem;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--f-display);font-weight:800;font-size:1.08rem;padding:.2rem .5rem;color:var(--navy-fg)}
.brand svg{width:28px;height:28px;flex:none}
.nav{display:grid;gap:2px}
.nav .sect{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-muted);padding:.9rem .7rem .35rem;font-weight:700}
.nav button{display:flex;align-items:center;gap:.7rem;border:0;background:transparent;color:var(--navy-muted);padding:.55rem .7rem;border-radius:8px;cursor:pointer;font-weight:600;text-align:left;width:100%}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--navy-fg)}
.nav button.on{background:var(--navy-2);color:var(--navy-fg);box-shadow:inset 3px 0 0 var(--lime)}
.nav .count{margin-left:auto;font-size:.7rem;background:var(--lime);color:#0A1F44;border-radius:999px;padding:0 .45rem;font-weight:700}
.rail-foot{margin-top:auto;display:flex;align-items:center;gap:.6rem;padding:.6rem;border-radius:10px;background:rgba(255,255,255,.04)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--lime);color:#0A1F44;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.rail-foot .who{flex:1;min-width:0;font-size:.82rem;line-height:1.25}
.rail-foot .who span{color:var(--navy-muted);font-size:.74rem}
.rail-foot button{border:0;background:transparent;color:var(--navy-muted);cursor:pointer;padding:.3rem;border-radius:6px}
.rail-foot button:hover{color:var(--navy-fg)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1.25rem clamp(1rem,3vw,2rem) 1rem;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .titles{flex:1;min-width:200px;display:grid;gap:.15rem}
.topbar .actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.content{padding:1.5rem clamp(1rem,3vw,2rem) 3rem;display:grid;gap:1.25rem;align-content:start}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:.75rem;padding:1rem 1.15rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2,.card-h h3{flex:1;min-width:0}
.card-b{padding:1.15rem}

/* Close header strip */
.closebar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.5rem;align-items:center;padding:1.15rem 1.25rem}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl2{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1}
.ring .lbl2 small{display:block;font-family:var(--f-body);font-size:.62rem;color:var(--muted);font-weight:600;margin-top:2px}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem}
.stage{display:grid;gap:.25rem}
.stage .bar{height:6px;border-radius:9px;background:var(--line)}
.stage .bar i{display:block;height:100%;border-radius:9px}
.stage .t{font-size:.74rem;color:var(--muted);font-weight:600}
.stage .n{font-family:var(--f-display);font-weight:800;font-size:1.1rem}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.kpi{padding:1rem 1.1rem;display:grid;gap:.3rem}
.kpi .v{font-family:var(--f-display);font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.kpi .s{font-size:.78rem;color:var(--muted)}
.meter{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:.2rem}
.meter i{display:block;height:100%;background:var(--good)}

.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.25rem;align-items:start}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:.65rem 1rem;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:.75rem 1rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num,td.r{white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tr.dim td{color:var(--faint)}
tr.group td{background:var(--surface-2);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:.5rem 1rem}
.biller{display:flex;align-items:center;gap:.7rem;min-width:200px}
.logo{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:.72rem;font-family:var(--f-display);flex:none;color:#fff}
.biller .nm{font-weight:700;line-height:1.25}
.biller .sub{font-size:.76rem;color:var(--muted)}
.lines{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.25rem}
.signoff{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line-2);display:inline-grid;place-items:center;font-size:.64rem;font-weight:800;color:var(--faint)}
.signoff.on{border:0;background:var(--good);color:var(--surface)}
.cleared{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:inline-grid;place-items:center}
.cleared.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.cleared svg{width:12px;height:12px}
.amt-neg{color:var(--fg)}
.amt-pos{color:var(--good)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.66rem;font-weight:700;color:var(--faint);text-align:center;letter-spacing:.08em;padding-bottom:.2rem}
.cal .d{aspect-ratio:1/1;max-width:100%;border-radius:8px;border:1px solid var(--line);padding:4px 5px;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface)}
.cal .d.blank{border:0;background:transparent}
.cal .d.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary)}
.cal .d.past{color:var(--faint)}
.cal .marks{display:flex;gap:2px;flex-wrap:wrap}
.cal .marks i{width:7px;height:7px;border-radius:2px}
.m-s{background:var(--info)}
.m-d{background:var(--warn)}
.m-p{background:var(--good)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:.75rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

.list{display:grid}
.list .it{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.15rem;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0}
.date-badge{width:42px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:var(--f-display)}
.date-badge b{display:block;font-size:1rem;line-height:1.5}
.date-badge span{display:block;font-size:.58rem;font-weight:700;letter-spacing:.1em;background:var(--surface-2);color:var(--muted);border-bottom:1px solid var(--line)}

/* Accounts */
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.acct{padding:1.15rem;display:grid;gap:.9rem}
.acct .top{display:flex;gap:.7rem;align-items:center}
.acct .bal{font-family:var(--f-display);font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.acct .rows{display:grid;gap:.35rem;font-size:.82rem}
.acct .rows div{display:flex;justify-content:space-between;gap:1rem}
.acct .rows span:first-child{color:var(--muted)}
.acct.add{border-style:dashed;display:grid;place-items:center;text-align:center;cursor:pointer;color:var(--muted);min-height:220px;background:transparent}
.acct.add:hover{border-color:var(--primary);color:var(--primary)}

/* Reconcile */
.rec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:1.25rem;align-items:start}
.recsum{display:grid}
.recsum .ln{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 1.15rem;font-size:.9rem}
.recsum .ln.sub{color:var(--muted);font-size:.84rem;padding-left:1.9rem}
.recsum .ln.tot{border-top:1px solid var(--line);font-weight:700}
.diff{margin:1rem 1.15rem 1.15rem;border-radius:var(--r);padding:1rem;display:grid;gap:.25rem}
.diff.bad{background:var(--bad-soft);color:var(--bad)}
.diff.ok{background:var(--good-soft);color:var(--good)}
.diff .v{font-family:var(--f-display);font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.acct-tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.acct-tab{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.6rem .9rem;cursor:pointer;text-align:left;display:grid;gap:.1rem;min-width:180px}
.acct-tab.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.acct-tab b{font-size:.86rem}
.acct-tab span{font-size:.74rem}
.chk{width:18px;height:18px;accent-color:var(--good);cursor:pointer}

/* Drawer & modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:flex-start;padding:4vh 16px;overflow-y:auto}
.drawer{width:min(580px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .2s ease-out}
.modal{width:min(640px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:pop .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
@keyframes pop{from{transform:translateY(10px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.drawer,.modal{animation:none}}
.dh{display:flex;gap:.8rem;align-items:flex-start;padding:1.15rem 1.25rem;border-bottom:1px solid var(--line)}
.dh .grow{flex:1;min-width:0}
.db{padding:1.25rem;display:grid;gap:1.3rem;overflow-y:auto;flex:1}
.df{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.sect{display:grid;gap:.8rem}
.sect-t{display:flex;align-items:center;gap:.5rem}
.stepno{width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:.72rem;font-weight:800}
.lineitems{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.lineitems .li{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:.6rem;align-items:center;padding:.45rem .7rem;border-bottom:1px solid var(--line)}
.lineitems .li:last-child{border-bottom:0;background:var(--surface-2);font-weight:700}
.x{border:0;background:transparent;cursor:pointer;padding:.3rem;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--surface-2)}

/* ---------- Dashboard ---------- */
function stageCounts(items){
  const c={awaiting:0,entered:0,scheduled:0,paid:0};items.forEach(i=>{if(c[i.status]!=null)c[i.status]++});return c;
}
function ring(pct,label,sub){
  const r=36,C=2*Math.PI*r;
  return `<div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--good)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}"/></svg><div class="lbl2"><div>${label}<small>${sub}</small></div></div></div>`;
}
function closeBar(){
  const items=S.close['2026-10'].filter(i=>i.status!=='offcycle');
  const recDone=S.accounts.filter(a=>S.signed[a.id]).length;
  const tasks=items.length+S.accounts.length;
  const done=items.filter(i=>i.status==='paid').length+recDone;
  const c=stageCounts(items);
  const stg=[['Awaiting statement',c.awaiting,'var(--faint)'],['Statement entered',c.entered,'var(--info)'],['Payment scheduled',c.scheduled,'var(--primary)'],['Paid',c.paid,'var(--good)'],['Accounts reconciled',recDone+' / '+S.accounts.length,'var(--good)']];
  return `<section class="card closebar">
    ${ring(done/tasks,`${done}/${tasks}`,'tasks done')}
    <div style="display:grid;gap:.8rem;min-width:0">
      <div style="display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap"><h2>October 2026 close</h2><span class="pill warn">24 days left</span><span class="small muted">Bills due Oct 1–31 · reconcile by Nov 5</span></div>
      <div class="stages">${stg.map((s,i)=>{const n=typeof s[1]==='number'?s[1]:recDone;const tot=i===4?S.accounts.length:items.length;return `<div class="stage"><span class="t">${s[0]}</span><span class="n num">${s[1]}</span><div class="bar"><i style="width:${(n/tot*100)||0}%;background:${s[2]}"></i></div></div>`}).join('')}</div>
    </div>
    <div class="cb-act"><button class="btn primary" data-nav="close">Open checklist ${I.chev}</button></div>
  </section>`;
}

  const marks={};

  S.bills.forEach(b=>{if(b.stmtDay&&!(b.id==='ladwp'))add(b.stmtDay,'s')});
  S.close['2026-10'].forEach(i=>{if(i.dueD<=31)add(i.dueD,i.status==='paid'?'p':'d')});
  let h='';['S','M','T','W','T','F','S'].forEach(x=>h+=`<div class="dow">${x}</div>`);
  for(let i=0;i<first;i++)h+='<div class="d blank"></div>';
  for(let d=1;d<=31;d++){h+=`<div class="d ${d===TODAY.d?'today':d<TODAY.d?'past':''}"><span class="num">${d}</span><span class="marks">${(marks[d]||[]).map(k=>`<i class="m-${k}"></i>`).join('')}</span></div>`}
  return `<div class="cal">${h}</div><div class="legend"><span><i class="m-s"></i>Statement date</span><span><i class="m-d"></i>Due</span><span><i class="m-p"></i>Paid</span></div>`;
}

function accountsView(){
  const body=`<div class="acct-grid">${S.accounts.map(a=>{const d=recDiff(a.id);return `<article class="card acct">
    <div class="top"><span class="logo" style="background:${a.color}">${a.inst.slice(0,2).toUpperCase()}</span><div style="min-width:0;flex:1"><div style="font-weight:700">${a.name}</div><div class="small muted">${a.type} ••${a.last4} · ${a.role}</div></div></div>
    <div><div class="eyebrow">Book balance</div><div class="bal num">${money(bookBal(a.id))}</div></div>
    <div class="rows num">
      <div><span>Opening (Oct 1)</span><span>${money(a.opening)}</span></div>
      <div><span>Bank balance (entered)</span><span>${money(S.bankBal[a.id])}</span></div>
      <div><span>Uncleared items</span><span>${txFor(a.id).filter(t=>!t.cl).length}</span></div>
      <div><span>Bills paid from here</span><span>${S.bills.filter(b=>b.acct===a.id).length}</span></div>
      <div><span>Last reconciled</span><span>${a.lastRec}</span></div>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">${S.signed[a.id]?'<span class="pill paid">Reconciled Oct</span>':d===0?'<span class="pill scheduled">Ready to sign off</span>':`<span class="pill overdue num">Off by ${money(Math.abs(d))}</span>`}<span style="flex:1"></span><button class="btn sm" data-actf="${a.id}">Activity</button><button class="btn sm primary" data-recgo="${a.id}">Reconcile</button></div>
  </article>`}).join('')}
  <button class="card acct add" data-modal="acct"><div style="display:grid;gap:.5rem;justify-items:center"><span style="width:40px;height:40px;border-radius:50%;border:1.5px dashed currentColor;display:grid;place-items:center">${I.plus.replace('<svg','<svg width="18" height="18"')}</span><b>Add a debit account</b><span class="small">Checking or savings you pay bills from</span></div></button></div>`;
  return shell('Accounts','Setup',`<button class="btn primary" data-modal="acct">${I.plus} Add account</button>`,body);
}
function acctModal(){
  return `<div class="overlay center" data-close-overlay><div class="modal" role="dialog" aria-label="Add account">
    <div class="dh"><div class="grow"><h2>Add a debit account</h2><p class="small muted">Enter the balance from your bank on the day you start tracking.</p></div><button class="x" data-close aria-label="Close">${I.close}</button></div>
    <form class="db" data-form="acct" id="acct-form">
      <div class="grid2"><div class="field"><label for="am-name">Account nickname</label><input class="input" id="am-name" required placeholder="e.g. Joint Checking"></div><div class="field"><label for="am-inst">Bank</label><input class="input" id="am-inst" required placeholder="e.g. Bank of America"></div></div>
      <div class="grid3"><div class="field"><label for="am-type">Type</label><select class="input" id="am-type"><option>Checking</option><option>Savings</option></select></div><div class="field"><label for="am-l4">Last 4 digits</label><input class="input num" id="am-l4" maxlength="4" placeholder="0000"></div><div class="field"><label for="am-date">Balance as of</label><input class="input" id="am-date" value="Oct 1, 2026"></div></div>
      <div class="field"><label for="am-bal">Opening balance</label><div class="input-pre"><span>$</span><input class="input num" id="am-bal" placeholder="0.00"></div><span class="hint">Use the bank's posted balance, not the available balance.</span></div>
    </form>
    <div class="df"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" type="submit" form="acct-form">Add account</button></div>
  </div></div>`;
}

/* ---------- Activity (expenses & payments) ---------- */
function activityView(){
  const f=S.actFilter;
  const list=S.tx.filter(t=>f==='all'||t.acct===f).sort((a,b)=>b.d-a.d||b.id-a.id);
  const out=list.filter(t=>t.amt<0&&t.cat!=='Transfer').reduce((s,t)=>s+t.amt,0);
  const inc=list.filter(t=>t.amt>0&&t.cat!=='Transfer').reduce((s,t)=>s+t.amt,0);
  const body=`
    <div class="filters"><div class="seg"><button data-actf="all" class="${f==='all'?'on':''}">All accounts</button>${S.accounts.map(a=>`<button data-actf="${a.id}" class="${f===a.id?'on':''}">${a.inst} ••${a.last4}</button>`).join('')}</div><span class="small muted">October 2026</span></div>
    <section class="kpis">
      <div class="card kpi"><span class="eyebrow">Money in</span><span class="v num" style="color:var(--good)">${money(inc)}</span><span class="s">Excludes transfers</span></div>
      <div class="card kpi"><span class="eyebrow">Money out</span><span class="v num">${money(out)}</span><span class="s">Bills and everyday expenses</span></div>
      <div class="card kpi"><span class="eyebrow">Bill payments</span><span class="v num">${money(list.filter(t=>t.bill).reduce((s,t)=>s+t.amt,0))}</span><span class="s">Linked to the close checklist</span></div>
      <div class="card kpi"><span class="eyebrow">Not yet cleared</span><span class="v num">${list.filter(t=>!t.cl).length}</span><span class="s">Waiting to post at the bank</span></div>
    </section>
    <section class="card">
      <div class="card-h"><h3>Quick add</h3><span class="small muted">Expenses, deposits and transfers you want to reconcile</span></div>
      <form class="card-b" data-form="quick" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;align-items:end">
        <div class="field"><label for="qa-date">Date</label><input class="input" id="qa-date" type="number" min="1" max="31" value="7"></div>
        <div class="field" style="grid-column:span 2"><label for="qa-desc">Description</label><input class="input" id="qa-desc" placeholder="e.g. Ralphs groceries" required></div>
        <div class="field"><label for="qa-cat">Category</label><select class="input" id="qa-cat">${['Groceries','Dining','Household','Auto & fuel','Medical','Insurance','Income','Transfer','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="qa-acct">Account</label><select class="input" id="qa-acct">${S.accounts.map(a=>`<option value="${a.id}" ${f===a.id?'selected':''}>${a.inst} ••${a.last4}</option>`).join('')}</select></div>
        <div class="field"><label for="qa-amt">Amount</label><div class="input-pre"><span>$</span><input class="input num" id="qa-amt" placeholder="−45.20" required></div></div>
        <button class="btn primary" type="submit">${I.plus} Add</button>
      </form>
    </section>
    <section class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th class="r">Amount</th><th style="text-align:center">Cleared</th></tr></thead>
      <tbody>${list.map(t=>{const a=acct(t.acct);return `<tr><td class="num">Oct ${t.d}</td><td><b>${esc(t.desc)}</b>${t.bill?`<div class="small" style="color:var(--primary)">Linked to ${bill(t.bill).name} · October close</div>`:''}</td><td><span class="chip">${t.cat}</span></td><td class="small">${a.inst} ••${a.last4}</td><td class="r num"><span class="${t.amt>0?'amt-pos':''}">${money(t.amt,{sign:true})}</span></td><td style="text-align:center"><span class="cleared ${t.cl?'on':''}">${t.cl?I.check:''}</span></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No activity yet for this account.</td></tr>'}</tbody>
    </table></div></section>`;
  return shell('Expenses & payments','October 2026',`<button class="btn" data-nav="reconcile">Reconcile</button>`,body);
}
function txModal(){
  return `<div class="overlay center" data-close-overlay><div class="modal" role="dialog" aria-label="Add expense">
    <div class="dh"><div class="grow"><h2>Add expense or deposit</h2></div><button class="x" data-close aria-label="Close">${I.close}</button></div>
    <form class="db" data-form="txm" id="txm-form">
      <div class="field"><span class="lbl">Type</span><div class="seg"><button type="button" class="on">Expense</button><button type="button">Deposit</button><button type="button">Transfer</button></div></div>
      <div class="grid2"><div class="field"><label for="tm-desc">Description</label><input class="input" id="tm-desc" required placeholder="e.g. Target"></div><div class="field"><label for="tm-amt">Amount</label><div class="input-pre"><span>$</span><input class="input num" id="tm-amt" required placeholder="0.00"></div></div></div>
      <div class="grid3"><div class="field"><label for="tm-date">Day (October)</label><input class="input num" id="tm-date" type="number" value="7"></div><div class="field"><label for="tm-cat">Category</label><select class="input" id="tm-cat">${['Groceries','Dining','Household','Auto & fuel','Medical','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label for="tm-acct">Account</label><select class="input" id="tm-acct">${S.accounts.map(a=>`<option value="${a.id}">${a.inst} ••${a.last4}</option>`).join('')}</select></div></div>
    </form>
    <div class="df"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" type="submit" form="txm-form">Add expense</button></div>
  </div></div>`;
}

/* ---------- Reconcile ---------- */
function reconcileView(){
  const id=S.recAcct, a=acct(id), tx=txFor(id).sort((x,y)=>x.d-y.d||x.id-y.id);
  const clIn=tx.filter(t=>t.cl&&t.amt>0).reduce((s,t)=>s+t.amt,0), clOut=tx.filter(t=>t.cl&&t.amt<0).reduce((s,t)=>s+t.amt,0);
  const unIn=tx.filter(t=>!t.cl&&t.amt>0).reduce((s,t)=>s+t.amt,0), unOut=tx.filter(t=>!t.cl&&t.amt<0).reduce((s,t)=>s+t.amt,0);
  const d=recDiff(id), signed=S.signed[id];
  const body=`
    <div class="acct-tabs">${S.accounts.map(x=>{const dd=recDiff(x.id);return `<button class="acct-tab ${x.id===id?'on':''}" data-recgo="${x.id}"><b>${x.name}</b><span class="num" style="color:${S.signed[x.id]||dd===0?'var(--good)':'var(--bad)'}">${S.signed[x.id]?'Signed off':dd===0?'Balanced':'Off by '+money(Math.abs(dd))}</span></button>`}).join('')}</div>
    <section class="rec">
      <div class="card">
        <div class="card-h"><h3>Balance check</h3><span class="small muted">${a.type} ••${a.last4}</span></div>
        <div class="card-b" style="display:grid;gap:.8rem;border-bottom:1px solid var(--line)">
          <div class="grid2"><div class="field"><label for="rc-bank">Bank balance</label><div class="input-pre"><span>$</span><input class="input num" id="rc-bank" value="${S.bankBal[id].toFixed(2)}" ${signed?'disabled':''}></div></div><div class="field"><label for="rc-asof">As of</label><input class="input" id="rc-asof" value="Oct 7, 2026" ${signed?'disabled':''}></div></div>
          <span class="hint">From your bank's website or statement: the posted (ledger) balance.</span>
        </div>
        <div class="recsum num">
          <div class="ln"><span>Opening balance · Oct 1</span><span>${money(a.opening)}</span></div>
          <div class="ln sub"><span>+ Cleared deposits</span><span>${money(clIn)}</span></div>
          <div class="ln sub"><span>− Cleared payments & expenses</span><span>${money(clOut)}</span></div>
          <div class="ln tot"><span>Cleared book balance</span><span>${money(clearedBal(id))}</span></div>
          <div class="ln sub"><span>Uncleared items (${tx.filter(t=>!t.cl).length})</span><span>${money(unIn+unOut)}</span></div>
          <div class="ln"><span class="muted">Projected book balance</span><span class="muted">${money(bookBal(id))}</span></div>
        </div>
        <div class="diff ${d===0?'ok':'bad'}"><span class="eyebrow" style="color:inherit">Difference · bank − cleared book</span><span class="v num">${money(d)}</span><span class="small">${signed?'Reconciled and signed off by Alex Rivera on Oct 7.':d===0?'Balanced. Sign off to complete this reconciliation.':'Tick each item that has posted at your bank. If it still doesn\'t balance, look for a missing or mistyped entry.'}</span></div>
        <div class="df" style="border-top:0;padding-top:0">${signed?'<button class="btn" data-act="unsign">Reopen</button>':`<button class="btn primary" data-act="sign" ${d===0?'':'disabled'}>${I.check} Sign off reconciliation</button>`}</div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Mark cleared items</h3><span class="small muted">Items that have posted at the bank by Oct 7</span></div>
        <div class="tbl-wrap"><table>
          <thead><tr><th style="width:44px"></th><th>Date</th><th>Description</th><th class="r">Amount</th></tr></thead>
          <tbody>${tx.map(t=>`<tr><td><input type="checkbox" class="chk" data-clear="${t.id}" ${t.cl?'checked':''} ${signed?'disabled':''} aria-label="Cleared: ${esc(t.desc)}" id="clr-${t.id}"></td><td class="num">Oct ${t.d}</td><td><label for="clr-${t.id}" style="cursor:pointer"><b>${esc(t.desc)}</b><div class="small muted">${t.cat}${t.bill?' · '+bill(t.bill).name+' bill':''}</div></label></td><td class="r num" style="font-weight:700"><span class="${t.amt>0?'amt-pos':''}">${money(t.amt,{sign:true})}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No October activity in this account. Enter the bank balance; it should equal the opening balance.</td></tr>'}</tbody>
        </table></div>
        <div class="card-b" style="border-top:1px solid var(--line)"><button class="btn sm" data-actf="${id}">${I.plus} Add a missing entry</button></div>
      </div>
    </section>`;
  return shell('Reconcile',`${a.name} · October 2026`,'',body);
}

/* ---------- Render ---------- */
function render(){
  const r=S.route; let h='';
  const ae=document.activeElement, aeId=ae&&ae.id, selS=ae&&ae.selectionStart;
  if(r==='login')h=loginView(); else if(r==='signup')h=signupView();
  else h=({dashboard:dashboardView,close:closeView,bills:billsView,accounts:accountsView,activity:activityView,reconcile:reconcileView}[r]||dashboardView)();
  if(S.drawer)h+=drawerView();
  if(S.modal){h+=({bill:billModal,acct:acctModal,tx:txModal}[S.modal.type])()}
  if(S.toast)h+=`<div class="toast" role="status">${esc(S.toast)}</div>`;
  $('#root').innerHTML=h;
  if(aeId){const el=document.getElementById(aeId);if(el){el.focus();try{if(selS!=null)el.setSelectionRange(selS,selS)}catch(e){}}}
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-period],[data-open],[data-close],[data-close-overlay],[data-modal],[data-act],[data-recgo],[data-actf],[data-billf],[data-bcat],[data-svc],.seg button');
  if(!t)return;
  if(t.hasAttribute('data-close-overlay')){if(e.target===t){S.drawer=null;S.modal=null;render()}return}
  if(t.dataset.nav){e.preventDefault();go(t.dataset.nav);return}
  if(t.dataset.period){S.period=t.dataset.period;render();return}
  if(t.dataset.open){S.drawer=t.dataset.open;if(!closeItems().some(i=>i.bill===S.drawer))S.period='2026-10';render();return}
  if(t.hasAttribute('data-close')){S.drawer=null;S.modal=null;render();return}
  if(t.dataset.modal){S.modal={type:t.dataset.modal,edit:t.dataset.edit||null};render();return}
  if(t.dataset.recgo){S.recAcct=t.dataset.recgo;go('reconcile');return}
  if(t.dataset.actf){S.actFilter=t.dataset.actf;if(S.route!=='activity')go('activity');else render();return}
  if(t.dataset.billf){S.billFilter=t.dataset.billf;render();return}
  if(t.dataset.bcat){S.modal.cat=t.dataset.bcat;S.modal.lines=[];render();return}
  if(t.dataset.svc){const s=t.dataset.svc;const cur=S.modal.lines||(S.modal.edit?bill(S.modal.edit).lines.slice():['Electricity']);S.modal.lines=cur.some(x=>x.startsWith(s))?cur.filter(x=>!x.startsWith(s)):[...cur,s];render();return}
  if(t.dataset.act){act(t.dataset.act);return}
  if(t.matches('.seg button')&&!t.dataset.period){[...t.parentNode.children].forEach(b=>b.classList.toggle('on',b===t))}
});
function act(a){
  if(a==='sign'){S.signed[S.recAcct]=true;acct(S.recAcct).lastRec='Oct 7';toast('Reconciliation signed off');return}
  if(a==='unsign'){S.signed[S.recAcct]=false;toast('Reconciliation reopened');return}
  const i=closeItems().find(x=>x.bill===S.drawer); const b=bill(S.drawer); if(!i)return;
  const amtEl=$('#dr-amt'); const total=amtEl?parseFloat(amtEl.value.replace(/[^0-9.\-]/g,''))||i.amt:[...document.querySelectorAll('.li-amt')].reduce((s,x)=>s+(parseFloat(x.value)||0),0);
  if(i.items)i.items=i.items.map((x,k)=>[x[0],parseFloat($('#dr-li-'+k).value)||0]);
  i.amt=+total.toFixed(2); i.est=false; i.acct=$('#dr-acct').value;
  const sd=$('#dr-sdate').value; i.stmt=sd; i.due=$('#dr-due').value||i.due;
  if(a==='save-stmt'){if(i.status==='awaiting')i.status='entered';S.drawer=null;toast(`${b.name} statement saved`);return}
  if(a==='schedule'){i.status='scheduled';i.paid='Scheduled '+($('#dr-pdate').value||i.due);S.drawer=null;toast(`${b.name} payment scheduled`);return}
  if(a==='pay'){
    i.status='paid'; i.paid=$('#dr-pdate').value||'Oct 7'; i.sign=true;
    const d=parseInt((i.paid.match(/\d+/)||[7])[0]);
    if(S.period==='2026-10'&&!S.tx.some(t=>t.bill===i.bill))S.tx.push({id:nextTx++,d,desc:`${b.name} — payment`,cat:'Bill payment',acct:i.acct,amt:-i.amt,cl:false,bill:i.bill});
    S.drawer=null; toast(`${b.name} marked paid · added to ${acct(i.acct).inst} activity`);
  }
}
document.addEventListener('input',e=>{
  if(e.target.classList.contains('li-amt')){const s=[...document.querySelectorAll('.li-amt')].reduce((a,x)=>a+(parseFloat(x.value)||0),0);const el=$('#dr-total');if(el)el.textContent=money(s)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.clear){const x=S.tx.find(q=>q.id==t.dataset.clear);x.cl=t.checked;render();return}
  if(t.id==='rc-bank'){const v=parseFloat(t.value.replace(/[^0-9.\-]/g,''));if(!isNaN(v)){S.bankBal[S.recAcct]=v;render()}}
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target.dataset.form;
  if(f==='login'||f==='signup'){go('dashboard');toast(f==='login'?'Signed in as Alex Rivera':'Household created');return}
  if(f==='bill'){
    const cat=S.modal.cat||(S.modal.edit?bill(S.modal.edit).cat:'Utilities');
    const lines=(S.modal.lines&&S.modal.lines.length?S.modal.lines:null)||(S.modal.edit?bill(S.modal.edit).lines:cat==='Credit cards'?['Pay statement balance']:cat==='Installment loans'?['Installment']:['Service']);
    const name=$('#bm-name').value.trim(); const dueMode=$('#bm-due').value, dv=$('#bm-dueval').value||'1';
    const data={name,cat,lines,freq:$('#bm-freq').value,cycle:$('#bm-freq').value==='Monthly'?null:$('#bm-cycle').value,stmtDay:parseInt($('#bm-sday').value)||null,due:dueMode.startsWith('Days')?`${dv} days after statement`:`Day ${dv}`,amtType:cat==='Installment loans'?'Fixed':'Varies',typical:parseFloat($('#bm-amt').value)||0,acct:$('#bm-acct').value,autopay:$('#bm-auto').checked,ref:'••'+($('#bm-ref').value||'0000')};
    if(S.modal.edit){Object.assign(bill(S.modal.edit),data);toast(`${name} updated`)}
    else{S.bills.push({id:'b'+Date.now(),color:'#3D5A80',ini:name.slice(0,3).toUpperCase(),...data});toast(`${name} added to recurring bills`)}
    S.modal=null;render();return;
  }
  if(f==='acct'){
    const nm=$('#am-name').value.trim(); const id='a'+Date.now(); const bal=parseFloat($('#am-bal').value)||0;
    S.accounts.push({id,name:nm,inst:$('#am-inst').value.trim(),type:$('#am-type').value,last4:$('#am-l4').value||'0000',opening:bal,color:'#2F6F5E',lastRec:'Never',role:'New account'});
    S.bankBal[id]=bal;S.signed[id]=false;S.modal=null;toast(`${nm} added`);return;
  }
  if(f==='quick'||f==='txm'){
    const p=f==='quick'?'qa':'tm'; let amt=parseFloat($(`#${p}-amt`).value.replace(/[^0-9.\-]/g,''))||0; const cat=$(`#${p}-cat`).value;
    if(f==='txm'||(!$(`#${p}-amt`).value.includes('-')&&!$(`#${p}-amt`).value.includes('−')&&cat!=='Income'))amt=-Math.abs(amt);
    if($(`#${p}-amt`).value.includes('−'))amt=-Math.abs(amt);
    if(cat==='Income')amt=Math.abs(amt);
    S.tx.push({id:nextTx++,d:parseInt($(`#${p}-date`).value)||7,desc:$(`#${p}-desc`).value.trim(),cat,acct:$(`#${p}-acct`).value,amt,cl:false});
    S.modal=null; toast('Entry added · mark it cleared when it posts'); return;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.drawer||S.modal)){S.drawer=null;S.modal=null;render()}});

/* ---------- Boot ---------- */
function fromHash(){try{const h=location.hash.slice(1);if(['login','signup','dashboard','close','bills','accounts','activity','reconcile'].includes(h)&&h!==S.route){S.route=h;S.drawer=null;S.modal=null;return true}}catch(e){}return false}
fromHash();
window.addEventListener('hashchange',()=>{if(fromHash())render()});
render();
</script>
