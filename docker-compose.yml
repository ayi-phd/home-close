# Local development only. `npm run db:up` starts MongoDB; `docker compose --profile api up -d`
# also runs the API in a container. Values come from .env (see .env.example).
services:
  mongo:
    image: mongo:8.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-homeclose}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      # Named volume: data survives container restarts and re-creation. `docker compose down -v` wipes it.
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER:-homeclose}:${MONGO_PASSWORD}@mongo:27017/homeclose?authSource=admin
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      FIXED_TODAY: ${FIXED_TODAY:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
